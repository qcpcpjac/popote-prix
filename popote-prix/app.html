<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="popote-version" content="4"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>La Popote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-first column, sticky tab bar; shelf-tag price labels are the signature detail */
:root{
  --bg:#F3F5F0; --surface:#FFFFFF; --sunk:#E8ECE4; --ink:#1B221D; --muted:#5D6A60; --line:#D5DCD2;
  --accent:#2C6A3E; --accent-ink:#FFFFFF; --accent-soft:#DDEBDF;
  --tag:#F2C230; --tag-ink:#2A2208; --warn:#B4441F; --ok:#2C6A3E;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121613; --surface:#1A201B; --sunk:#232A24; --ink:#E6ECE5; --muted:#9AA79C; --line:#2F3830;
  --accent:#7DC28E; --accent-ink:#0D1A10; --accent-soft:#22362A;
  --tag:#E5BA3A; --tag-ink:#1E1806; --warn:#F08A63; --ok:#7DC28E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121613; --surface:#1A201B; --sunk:#232A24; --ink:#E6ECE5; --muted:#9AA79C; --line:#2F3830;
  --accent:#7DC28E; --accent-ink:#0D1A10; --accent-soft:#22362A;
  --tag:#E5BA3A; --tag-ink:#1E1806; --warn:#F08A63; --ok:#7DC28E; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:760px;margin:0 auto;padding-block:20px 64px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

.budget{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.budget-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.budget-big{font-family:var(--f-mono);font-size:26px;font-weight:500}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.over>i{background:var(--warn)}
.stats{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.stats b{color:var(--ink);font-family:var(--f-mono);font-weight:500}

nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:4px;padding-block:6px;border-bottom:1px solid var(--line);overflow-x:auto}
nav.tabs a{flex:1;text-align:center;white-space:nowrap;padding:9px 10px;border-radius:8px;text-decoration:none;color:var(--muted);font-weight:600;font-size:14px}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg)}
nav.tabs a .n{font-family:var(--f-mono);font-size:12px;opacity:.75;margin-left:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.notice{border:1px dashed var(--line);border-radius:10px;padding:12px 14px;font-size:14px;background:var(--surface)}
.notice.err{border-style:solid;border-color:var(--warn);color:var(--warn)}
.notice.example{border-color:var(--tag);background:color-mix(in srgb,var(--tag) 12%,var(--surface))}

.progress{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:10px}
.dots{display:inline-flex;gap:4px}.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:b 1s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25}40%{opacity:1}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none}.bar>i{transition:none}}

/* Menu */
.day{display:grid;gap:8px}
.day-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding-top:6px}
.day-head .mono{font-size:13px;color:var(--muted)}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.meal{overflow:hidden}
.meal>summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;padding:8px 12px 8px 8px}
.thumb{width:56px;height:56px;border-radius:8px;object-fit:cover;background:var(--sunk);display:block}
.meal.hero>summary{grid-template-columns:1fr auto;padding:0;gap:0}
.hero-img{grid-column:1/-1;position:relative;aspect-ratio:16/8;max-width:100%;background:var(--sunk);overflow:hidden}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
.hero-img .chip{position:absolute;left:10px;top:10px;background:var(--surface);color:var(--accent)}
.meal.hero .meal-name{padding:10px 12px;font-size:16px}
.meal.hero>summary>.tag{margin-right:12px}
.ing{width:36px;height:36px;object-fit:contain;display:block}
.ing.none{background:var(--sunk);border-radius:8px}
a{color:var(--accent);font-weight:600}
.links{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.credit-ph{position:absolute;right:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.credit{font-size:12px;color:var(--muted);text-align:center}
.meal>summary::-webkit-details-marker{display:none}
.chip{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:3px 7px;border-radius:5px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.souper{background:var(--accent-soft);color:var(--accent)}
.meal-name{min-width:0;font-weight:600}
.meal-name small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.tag{font-family:var(--f-mono);font-size:13px;font-weight:500;background:var(--tag);color:var(--tag-ink);padding:2px 7px 2px 9px;border-radius:3px 6px 6px 3px;position:relative;white-space:nowrap}
.tag::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:3px;margin-top:-1.5px;border-radius:50%;background:var(--tag-ink);opacity:.5}
.tag.zero{background:var(--sunk);color:var(--muted)}
.tag.zero::before{display:none}
.recipe{border-top:1px solid var(--line);padding:12px 14px 14px;display:grid;gap:12px}
.recipe ul,.recipe ol{margin:0;padding-left:20px;display:grid;gap:3px}
.recipe h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.swap{display:flex;gap:8px;flex-wrap:wrap}
.swap input{flex:1 1 200px;min-width:0}

/* Groceries */
.store{display:grid;gap:4px}
.store-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:10px 0 4px;border-bottom:2px solid var(--ink)}
.store-head h2{font-size:18px}
.aisle{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;padding:10px 0 2px}
.item{display:grid;grid-template-columns:auto 36px 1fr auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.item input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.item .nm{min-width:0}
.item .nm small{color:var(--muted);font-size:13px;margin-left:6px}
.item.done .nm{text-decoration:line-through;color:var(--muted)}
.item.done .tag{opacity:.45}

/* Forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.field{display:grid;gap:5px}
.field label,.legend{font-size:13px;font-weight:600}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.checks label{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;font-size:14px;background:var(--bg)}
.checks input{accent-color:var(--accent);margin:0}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font-size:13px;background:var(--sunk);border-radius:99px;padding:3px 10px}
.item .src{display:block;font-size:12px;color:var(--muted);margin-top:1px}
.mini{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:1px 5px;border-radius:4px;margin-right:5px;vertical-align:1px}
.mini.real{background:var(--accent-soft);color:var(--accent)}
.mini.est{background:var(--sunk);color:var(--muted)}
.mini.sale{background:var(--tag);color:var(--tag-ink)}
.deals{display:grid;gap:0}
.deal{display:grid;grid-template-columns:1fr auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.deal small{color:var(--muted)}
.deal .was{text-decoration:line-through;color:var(--muted);font-size:12px;margin-right:6px;font-family:var(--f-mono)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:14px;z-index:20}
</style>

</head><body style="margin:0">
<div class="app">
  <header class="top">
    <div class="brand"><small>Menu et épicerie</small><h1>La Popote</h1></div>
    <button class="btn primary" id="genTop" type="button">Générer ma semaine</button>
  </header>

  <section class="budget" aria-label="Budget">
    <div class="budget-row">
      <div><div class="muted" style="font-size:13px">Épicerie estimée</div><div class="budget-big" id="total">0,00 $</div></div>
      <div style="text-align:right"><div class="muted" style="font-size:13px">Budget</div><div class="mono" id="budgetLbl" style="font-size:18px">0 $</div></div>
    </div>
    <div class="bar" id="bar"><i style="width:0"></i></div>
    <div class="stats" id="stats"></div>
  </section>

  <div id="banner"></div>

  <nav class="tabs" aria-label="Sections">
    <a href="#menu" data-tab="menu">Menu</a>
    <a href="#epicerie" data-tab="epicerie">Épicerie<span class="n" id="nGroc"></span></a>
    <a href="#garde-manger" data-tab="garde-manger">Garde-manger</a>
    <a href="#reglages" data-tab="reglages">Réglages</a>
  </nav>

  <main id="view"></main>
</div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
const DAYS = ["Lundi","Mardi","Mercredi","Jeudi","Vendredi","Samedi","Dimanche"];
const TYPES = {dejeuner:"Déjeuner", diner:"Dîner", souper:"Souper"};
const TYPE_ORDER = ["dejeuner","diner","souper"];
const STORES = ["Maxi","Super C","IGA","Metro","Costco","Walmart","Dollarama"];
const AISLES = ["Fruits et légumes","Viandes","Poissons","Produits laitiers et œufs","Boulangerie","Épicerie sèche","Conserves et sauces","Épices et condiments","Surgelés","Collations","Autre"];
const money = new Intl.NumberFormat("fr-CA",{style:"currency",currency:"CAD"});

/* ---------- Real price data (Project Hammer + StatCan), published beside the page ---------- */
const CODE_NAME = {N:"No Frills", M:"Metro", S:"Sobeys", W:"Walmart"};
const STORE_CODE = {"Maxi":"N","Super C":"N","IGA":"S","Metro":"M","Walmart":"W"};
const FOOD = /chicken|beef|pork|turkey|salmon|fish|shrimp|tilapia|cod|sausage|bacon|ham|ground|steak|egg|milk|cheese|yogurt|butter|cream|bread|rice|pasta|spaghetti|potato|onion|carrot|broccoli|pepper|tomato|lettuce|cucumber|apple|banana|orange|berr|grape|avocado|mushroom|zucchini|cabbage|bean|lentil|tortilla|flour|oil|sauce|soup|cereal|oat|frozen vegetable|tuna|corn|peas|spinach|celery|squash|garlic|lemon|lime/;
let PRIX = null, QC = null, sampleTools = false, sampleImages = false;
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9 ]/g," ");
const stem = w => w.length>3 && w.endsWith("s") ? w.slice(0,-1) : w;
async function loadPrices(){
  try{
    const [a,b] = await Promise.all([fetchPrix("prix.json"), fetchPrix("statcan-qc.json").catch(()=>null)]);
    for(const x of a.items){ x.k = norm(x[1]).split(/\s+/).filter(Boolean).map(stem); }
    PRIX = a; QC = b;
  }catch{ PRIX = null; }
  render();
}
/* ---------- Food photos (TheMealDB), packed into chunk files beside the page ---------- */
let IMGIDX = null; const chunkCache = {};
const IMG_CAT = {Beef:"boeuf",Chicken:"poulet",Pork:"porc",Seafood:"mer",Pasta:"pates",Vegetarian:"vege",Breakfast:"dejeuner"};
const AISLE_ING = {"Viandes":"Chicken","Poissons":"Salmon","Produits laitiers et œufs":"Milk","Boulangerie":"Bread","Épicerie sèche":"Rice","Conserves et sauces":"Chopped Tomatoes","Épices et condiments":"Black Pepper","Fruits et légumes":"Carrots","Surgelés":"Frozen Peas"};
async function loadImgIndex(){
  try{ const d = await fetch("data/img-index.json").then(r=>r.json());
    d.meals.forEach(m=>{ m.k = norm(m[1]).split(/\s+/).filter(w=>w.length>2).map(stem); });
    d.ingMap = new Map(d.ing.map(([n,g])=>[norm(n).trim(),[n,g]]));
    d.ing.forEach(x=>{ x.k = norm(x[0]).split(/\s+/).filter(Boolean).map(stem); });
    IMGIDX = d; hydrate(); }catch{}
}
function chunk(name){ return chunkCache[name] ||= fetch(`data/img-${name}.json`).then(r=>r.json()).catch(()=>({})); }
const hashN = s => { let h=0; for(const c of String(s)) h=(h*31+c.charCodeAt(0))|0; return Math.abs(h); };
function mealPick(m){
  if(!IMGIDX) return null;
  let q = m.en || "", cat = m.cat;
  if(/^restes/i.test(m.name)){ const src = state.plan.meals.find(x=>x.type==="souper" && x.day===m.day-1) || state.plan.meals.find(x=>norm(m.name).includes(norm(x.name).slice(0,12)) && x!==m); if(src){ q = src.en||""; cat = src.cat; } else return null; }
  const toks = norm(q).split(/\s+/).filter(w=>w.length>2).map(stem);
  let best = null, bs = 0;
  for(const x of IMGIDX.meals){ let h=0; for(const t of toks) if(x.k.some(w=>w.startsWith(t))) h++; if(!h) continue;
    const s = h*10 + (x[2]===cat?4:0) - x.k.length*0.2; if(s>bs){ bs=s; best=x; } }
  if(!best){ const pool = IMGIDX.meals.filter(x=>x[2]===(cat||"Chicken")); if(pool.length) best = pool[hashN(m.name)%pool.length]; }
  return best ? [best[0], best[3]] : null;
}
function ingPick(g){
  if(!IMGIDX) return null;
  const q = norm(g.en||"").trim();
  if(q){ const exact = IMGIDX.ingMap.get(q) || IMGIDX.ingMap.get(q.replace(/s$/,"")); if(exact) return exact;
    const toks = q.split(/\s+/).map(stem); let best=null, bs=0;
    for(const x of IMGIDX.ing){ let h=0; for(const t of toks) if(x.k.some(w=>w.startsWith(t))) h++; if(!h) continue; const s=h*10-x.k.length; if(s>bs){bs=s;best=x;} }
    if(best) return best; }
  const fb = AISLE_ING[g.aisle]; return fb ? IMGIDX.ingMap.get(norm(fb).trim()) : null;
}
function imgSlot(cls, alt, pickFn, meal){ const i = el("img",{class:cls,alt,loading:"lazy",decoding:"async"}); i._pick = pickFn; i._meal = meal; return i; }
function hydrate(){ for(const i of document.querySelectorAll("img")){ if(!i._pick || i.getAttribute("src") || i._busy) continue; i._busy = true; fillImg(i); } }
async function fillImg(i){
  let m = i._meal;
  if(m && /^restes/i.test(m.name)) m = state.plan.meals.find(x=>x.type==="souper" && x.day===m.day-1) || null;
  const hero = i.closest(".hero-img");
  if(m && navigator.onLine && m.en){
    if(m.photo===undefined || m.pv!==PHOTO_V) await fetchMealPhoto(m);
    if(m.photo){
      i.onerror = ()=>{ i.onerror = null; i.removeAttribute("src"); if(hero) hero.hidden = true; else localImg(i); };
      i.src = m.photo;
      if(hero && m.credit && !hero.querySelector(".credit-ph")) hero.append(el("span",{class:"credit-ph"},`Photo : ${m.credit.name} / ${m.credit.site||"Pexels"}`));
      return;
    }
  }
  if(hero){ if(i._meal && !/^restes/i.test(i._meal.name)) hero.hidden = true; i._busy = false; return; }
  localImg(i);
}
function localImg(i){
  if(!IMGIDX){ i._busy = false; return; }
  const p = i._pick(); if(!p){ i.classList.add("none"); return; }
  const [id, g] = p; chunk(g).then(c=>{ if(c[id]) i.src = c[id]; else i.classList.add("none"); });
}
function userCodes(){ return [...new Set(state.settings.stores.map(s=>STORE_CODE[s]).filter(Boolean))]; }
function storesFor(code){ return state.settings.stores.filter(s=>STORE_CODE[s]===code); }
function searchPrix(q, perStore=3){
  if(!PRIX) return [];
  const toks = norm(q).split(/\s+/).filter(t=>t.length>1).map(stem); if(!toks.length) return [];
  const codes = userCodes(), best = {};
  for(const x of PRIX.items){
    if(!codes.includes(x[0])) continue;
    let hit = 0; for(const t of toks) if(x.k.some(w=>w.startsWith(t))) hit++;
    if(hit < toks.length) continue;
    const score = hit*10 - x.k.length*0.3;
    (best[x[0]] ||= []).push([score,x]);
  }
  const out = [];
  for(const [c,list] of Object.entries(best)){ list.sort((a,b)=>b[0]-a[0]); for(const [,x] of list.slice(0,perStore)) out.push(x); }
  return out;
}
function fmtHit(x){ return {magasin:storesFor(x[0]).join(" / ")+` (données ${CODE_NAME[x[0]]})`, produit:x[1].slice(0,70), format:x[2], prix:x[3], unitaire:x[4]||undefined, special: x[5]?`en spécial, régulier ${x[5]}`:undefined}; }
function searchReceipts(q){
  const toks = norm(q).split(/\s+/).filter(t=>t.length>2).map(stem);
  return (state.receipts||[]).filter(r=>{ const k=norm(r.item).split(/\s+/).map(stem); return toks.length && toks.every(t=>k.some(w=>w.startsWith(t))); }).slice(-4)
    .map(r=>({magasin:r.store, produit:r.item, format:r.fmt, prix:r.price, source:`ton reçu du ${r.date}`}));
}
function specials(limit=40){
  if(!PRIX) return [];
  const codes = userCodes();
  return PRIX.items.filter(x=>x[5] && codes.includes(x[0]) && FOOD.test(norm(x[1])) && x[3]>=1.5)
    .map(x=>({x, pct:(x[5]-x[3])/x[5]})).filter(d=>d.pct>=0.15 && d.pct<0.8)
    .sort((a,b)=>b.pct-a.pct).slice(0,limit).map(d=>d.x);
}
function specialsText(){
  const sp = specials(45); if(!sp.length) return "";
  return `Spéciaux réels cette semaine (prix relevés en magasin; magasin entre parenthèses = équivalent au Québec). Bâtis le menu autour de ces aubaines quand c'est logique :\n` +
    sp.map(x=>`- ${storesFor(x[0]).join("/")}: ${x[1]} ${x[2]} à ${x[3]} $ (rég. ${x[5]} $)`).join("\n");
}
function qcText(){
  if(!QC) return "";
  const m = QC.meta.mois[QC.meta.mois.length-1];

/* Price the current list against the real price data, using a page tool Claude can call */
async function priceList(){
  if(!sample||busy||!PRIX||!sampleTools||!state.plan.groceries.length) return;
  const g = state.plan.groceries.map((x,i)=>({i, item:x.item, en:x.en, qty:x.qty, aisle:x.aisle, store:x.store, estimate:x.price}));
  const map = state.settings.stores.map(s=>STORE_CODE[s]?`${s} = données ${CODE_NAME[STORE_CODE[s]]}`:`${s} = aucune donnée (garde une estimation)`).join("; ");
  const prompt = `Tu dois mettre de VRAIS prix sur une liste d'épicerie québécoise.
Tu as un outil chercher_prix qui cherche dans une base de prix réels relevés en magasin (noms de produits en ANGLAIS) et dans les reçus de l'utilisateur. Appelle-le avec des termes de recherche courts en anglais (ex. "chicken breast", "ground beef lean", "broccoli"), jusqu'à 15 articles par appel; tu peux l'appeler plusieurs fois.
Épiceries de l'utilisateur et source de prix : ${map}.
Pour chaque article : choisis le produit et le FORMAT qui couvrent la quantité requise au meilleur prix parmi ses épiceries (tiens compte des spéciaux). Si un format plus grand est nécessaire, multiplie. Le prix d'un reçu de l'utilisateur prime s'il est récent.

${qcText()}
Liste :\n${JSON.stringify(g)}
Réponds uniquement avec un objet JSON : {"groceries":[{"i":0,"item":"nom en français","en":"short generic English ingredient name, e.g. chicken breast","qty":"format acheté","aisle":"même rayon","store":"une des épiceries de l'utilisateur","price":12.99,"real":true,"sale":false,"src":"Metro · Chicken Breast Boneless 1 kg à 13,99 $"}]} avec TOUS les articles.`;
  const tools = [{name:"chercher_prix", description:"Cherche des prix réels. Entrée : liste de recherches {id, en, fr}. Retourne pour chaque id jusqu'à 3 produits par épicerie (magasin, produit, format, prix, prix unitaire, spécial) et les prix tirés des reçus de l'utilisateur.",
    inputSchema:{type:"object",properties:{recherches:{type:"array",items:{type:"object",properties:{id:{type:"integer"},en:{type:"string"},fr:{type:"string"}},required:["id","en"]}}},required:["recherches"]},
    execute:(input)=>{ const r = Array.isArray(input?.recherches)?input.recherches.slice(0,15):[]; if(ui.progress){ ui.progress.n += r.length; renderProgress(); }
      return r.map(q=>({id:q.id, resultats:searchPrix(String(q.en||""),3).map(fmtHit), recus:searchReceipts(String(q.fr||q.en||""))})); }}];
  await run("Claude vérifie les vrais prix", prompt, data => {

  }, {tools}, "articles vérifiés");

async function run(label, prompt, apply, opts={}, unit){
  const ctl = new AbortController(); busy = ctl; ui.err=""; ui.progress={label, n:0, unit, t0:Date.now()}; render(); startTick();
  let ok = false;
  try{
    const onText = opts.tools ? undefined : ({text})=>{ const n=(text.match(/"name"\s*:|"item"\s*:/g)||[]).length; if(ui.progress&&n!==ui.progress.n){ ui.progress.n=n; renderProgress(); } };
    const data = await sample.json(prompt, {...opts, signal:ctl.signal, onText});
    busy = null; ui.progress = null;
    await apply(data);
    save(); ok = true;
  }catch(e){ busy=null; ui.progress=null; ui.err = errText(e); }
  render();
  return ok;
}

/* Tolerant JSON: whole text, else a fenced block, else first { or [ to last } or ] */
function parseJSONLoose(t){
  try{ return JSON.parse(t); }catch{}
  const f = t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{ return JSON.parse(f[1]); }catch{} }
  const a = t.search(/[\[{]/), b = Math.max(t.lastIndexOf("}"), t.lastIndexOf("]"));
  if(a>=0 && b>a){ try{ return JSON.parse(t.slice(a,b+1)); }catch{} }
  throw {code:"invalid_json", text:t};
}
async function fileToImageBlock(file){
  const bmp = await createImageBitmap(file);
  const s = Math.min(1, 1600/Math.max(bmp.width,bmp.height));
  const c = document.createElement("canvas"); c.width = Math.round(bmp.width*s); c.height = Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const data = c.toDataURL("image/jpeg",0.85).split(",")[1];
  return {type:"image", source:{type:"base64", media_type:"image/jpeg", data}};
}
async function callClaude(messages, tools, signal, onText){
  const c = cfg(); if(!c.apiKey) throw {code:"no_key"};
  let r;
  try{
    r = await fetch("https://api.anthropic.com/v1/messages", {method:"POST", signal,
      headers:{"content-type":"application/json","x-api-key":c.apiKey,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
      body: JSON.stringify({model:c.model||DEFAULT_CFG.model, max_tokens:16000, stream:true, messages,
        ...(tools?.length?{tools:tools.map(t=>({name:t.name, description:t.description, input_schema:t.inputSchema||{type:"object",properties:{}}}))}:{})})});
  }catch(e){ throw e?.name==="AbortError" ? {code:"cancelled"} : {code:"network"}; }
  if(!r.ok){
    const body = await r.json().catch(()=>({}));
    const msg = body?.error?.message||"";
    const code = r.status===401||r.status===403 ? "auth" : r.status===429 ? "rate_limited" : r.status===400 && /model/i.test(msg) ? "bad_model" : r.status===400 && /credit/i.test(msg) ? "credit" : "upstream_error";
    throw {code, message: msg||String(r.status)};
  }
  /* Rebuild the message from the event stream */
  const blocks = [], partial = {}; let stop = null, buf = "", text = "";
  const reader = r.body.getReader(), dec = new TextDecoder();
  try{
    for(;;){
      const {done, value} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      let k;
      while((k = buf.indexOf("\n\n")) >= 0){
        const evt = buf.slice(0,k); buf = buf.slice(k+2);
        const line = evt.split("\n").find(l=>l.startsWith("data:")); if(!line) continue;
        let d; try{ d = JSON.parse(line.slice(5)); }catch{ continue; }
        if(d.type==="content_block_start"){ blocks[d.index] = {...d.content_block}; if(d.content_block.type==="tool_use") partial[d.index] = ""; if(d.content_block.type==="text") blocks[d.index].text = ""; }
        else if(d.type==="content_block_delta"){
          if(d.delta.type==="text_delta"){ blocks[d.index].text += d.delta.text; text += d.delta.text; onText?.(text); }
          else if(d.delta.type==="input_json_delta") partial[d.index] += d.delta.partial_json;
        }
        else if(d.type==="content_block_stop" && partial[d.index]!==undefined){ try{ blocks[d.index].input = JSON.parse(partial[d.index]||"{}"); }catch{ blocks[d.index].input = {}; } }
        else if(d.type==="message_delta") stop = d.delta?.stop_reason || stop;
        else if(d.type==="error") throw {code: d.error?.type==="overloaded_error" ? "upstream_error" : "upstream_error", message:d.error?.message};
      }
    }
  }catch(e){ if(e?.name==="AbortError") throw {code:"cancelled"}; if(e?.code) throw e; throw {code:"network"}; }
  return {content: blocks.filter(Boolean), stop_reason: stop};
}
/* Same shape as the artifact's sample.json(prompt, {tools, images, signal}) */
const sampleNative = {
  async json(prompt, opts={}){
    const content = [];
    for(const f of [].concat(opts.images||[])) content.push(await fileToImageBlock(f));
    content.push({type:"text", text: prompt + "\n\nTa réponse finale sera lue par un programme : réponds uniquement avec le JSON demandé."});
    const messages = [{role:"user", content}];
    for(let round=0; round<8; round++){
      const res = await callClaude(messages, opts.tools, opts.signal, opts.onText ? (t)=>opts.onText({text:t}) : null);
      if(res.stop_reason === "tool_use" && opts.tools){
        messages.push({role:"assistant", content:res.content});
        const results = [];
        for(const b of res.content.filter(b=>b.type==="tool_use")){
          const t = opts.tools.find(t=>t.name===b.name);
          let out; try{ out = await t.execute(b.input||{}, {signal:opts.signal}); }catch(e){ out = "Error: "+(e?.message||e); }
          results.push({type:"tool_result", tool_use_id:b.id, content: typeof out==="string"?out:JSON.stringify(out)});
        }
        messages.push({role:"user", content:results});
        continue;
      }
      const text = res.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
      if(res.stop_reason === "max_tokens") throw {code:"invalid_json", text};
      return parseJSONLoose(text);
    }
    throw {code:"upstream_error"};
  },
  limits: async () => ({tools:{maxCount:8}, images:{maxCount:1}})
};

    }
    if(!m.photo && pk){
      const r = await fetch(`https://api.pexels.com/v1/search?per_page=5&orientation=landscape&query=${encodeURIComponent(m.en+" dish")}`,{headers:{Authorization:pk}}).then(r=>r.ok?r.json():null);
      const ph = r?.photos?.[0];
      if(ph){ m.photo = ph.src.large; m.credit = {name:ph.photographer, site:"Pexels", url:ph.url}; }
    }
    const tries = [m.en, m.en.split(/\s+/).slice(-2).join(" ")].filter((v,i,a)=>v && a.indexOf(v)===i);
    for(const q of tries){
      const r = await fetch("https://www.themealdb.com/api/json/v1/1/search.php?s="+encodeURIComponent(q)).then(r=>r.json());
      const list = r?.meals||[]; if(!list.length) continue;
      const toks = norm(m.en).split(/\s+/).filter(w=>w.length>2).map(stem);
      let best = null, bs = 0;
      for(const x of list){ const k = norm(x.strMeal).split(/\s+/).map(stem); const hit = toks.filter(t=>k.some(w=>w.startsWith(t))).length; const s = hit*10 - k.length; if(hit===toks.length && s>bs){bs=s;best=x;} }
      if(!best) continue;
      if(!m.photo) m.photo = best.strMealThumb;
      m.mealdb = {id:best.idMeal, name:best.strMeal, source:best.strSource||"", yt:best.strYoutube||""};
      break;
    }
    save();
  }catch{ m.photo = undefined; }
}

/* Barcode → Open Food Facts → pantry */
async function scanToPantry(){
  if(!Scanner){ toast("Le scanner n'est pas disponible"); return; }
  try{
    const av = await Scanner.isGoogleBarcodeScannerModuleAvailable().catch(()=>({available:true}));
    if(!av.available){ toast("Installation du module de scan… réessaie dans un instant"); await Scanner.installGoogleBarcodeScannerModule(); return; }
    const {barcodes} = await Scanner.scan();
    const code = barcodes?.[0]?.rawValue; if(!code) return;
    toast("Recherche du produit…");
    const r = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name_fr,product_name,brands,quantity`).then(r=>r.json());
    const p = r?.product;
    const name = p ? [p.product_name_fr||p.product_name, p.brands&&`(${p.brands.split(",")[0]})`, p.quantity].filter(Boolean).join(" ") : "";
    if(!name){ toast("Produit inconnu ("+code+")"); return; }
    state.pantry = (state.pantry.trim()+"\n"+name).trim(); save(); render(); toast("Ajouté : "+name);
  }catch(e){ if(!/cancel/i.test(e?.message||"")) toast("Scan impossible"); }
}

async function fetchPrix(name){
  const u = cfg().pricesUrl;
  if(u){ try{ const r = await fetch(`${u}/${name}`,{cache:"no-cache"}); if(r.ok){ const j = await r.json(); j._from = "en ligne"; return j; } }catch{} }
  const j = await fetch("data/"+name).then(r=>r.json()); j._from = "inclus dans l'app"; return j;
}
